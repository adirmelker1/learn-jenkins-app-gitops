apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-app-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://github.com/adirmelker1/learn-jenkins-app-gitops" # ה-URL של מאגר ה-GitOps שלך
    targetRevision: HEAD
    path: apps/my-app/dev
  destination:
    server: "https://kubernetes.default.svc"
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
